name: Collie Kart P006.3 Native Frame Hook Build

on:
  push:
    branches: [master, collie-kart-p005-sensor-fusion, collie-kart-p006-first-contact, collie-kart-p006-input-pipeline-trace, collie-kart-p0062-native-control-preflight, collie-kart-p0063-frame-hook-first-contact]
  pull_request:
    branches: [master, collie-kart-p005-sensor-fusion]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - uses: actions/checkout@v4
      - name: Build P006.3
        run: make
      - name: Upload plugin 3GX
        uses: actions/upload-artifact@v4
        with:
          name: Collie-Kart-P0063-3GX
          path: CTRPluginFramework-BlankTemplate.3gx
          if-no-files-found: error
      - name: Upload debug ELF
        uses: actions/upload-artifact@v4
        with:
          name: Collie-Kart-P0063-ELF
          path: CTRPluginFramework-BlankTemplate.elf
          if-no-files-found: error
