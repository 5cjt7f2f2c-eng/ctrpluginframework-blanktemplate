name: Collie Kart P008.1 Navigation Build

on:
  push:
    branches: [master, collie-kart-p005-sensor-fusion, collie-kart-p006-first-contact, collie-kart-p006-input-pipeline-trace, collie-kart-p0062-native-control-preflight, collie-kart-p0063-frame-hook-first-contact, collie-kart-p0063a-pass-through-safety, collie-kart-p0063b-native-one-shot-a, collie-kart-p0064-four-control-validation, collie-kart-p007a-demonstration-recorder, collie-kart-p007a1-capture-startup-diagnostics, collie-kart-p007b-learning-multiattempt, collie-kart-p007b1-attempt-startup-fix, collie-kart-p007b2-finish-stop-control, collie-kart-p008-independent-learning-v1, collie-kart-p0081-checkpoint-navigation]
  pull_request:
    branches: [master, collie-kart-p005-sensor-fusion]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - uses: actions/checkout@v4
      - name: Build P008.1
        run: make
      - name: Upload plugin 3GX
        uses: actions/upload-artifact@v4
        with:
          name: Collie-Kart-P0081-3GX
          path: CollieKart.3gx
          if-no-files-found: error
      - name: Upload debug ELF
        uses: actions/upload-artifact@v4
        with:
          name: Collie-Kart-P0081-ELF
          path: CollieKart.elf
          if-no-files-found: error
