name: Collie Kart P005 Sensor Fusion Build

on:
  push:
    branches: [master, collie-kart-p001, collie-kart-p002-telemetry-probe, collie-kart-p003-flight-recorder, collie-kart-p004-environment-rewards, collie-kart-p005-sensor-fusion]
  pull_request:
    branches: [master, collie-kart-p001, collie-kart-p002-telemetry-probe, collie-kart-p003-flight-recorder, collie-kart-p004-environment-rewards]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - uses: actions/checkout@v4
      - name: Build P005
        run: make
      - name: Upload plugin 3GX
        uses: actions/upload-artifact@v4
        with:
          name: Collie-Kart-P005-3GX
          path: CTRPluginFramework-BlankTemplate.3gx
          if-no-files-found: error
      - name: Upload debug ELF
        uses: actions/upload-artifact@v4
        with:
          name: Collie-Kart-P005-ELF
          path: CTRPluginFramework-BlankTemplate.elf
          if-no-files-found: error
